<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller Tendencias - Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Paleta inspirada en los tonos carmesí, rosa intenso y negro de un álbum de Stray Kids */
    :root {
      --fondo: #fff4f6;
      --tarjeta: #ffffff;
      --texto: #1a0b10;
      --suave: #7a5560;
      --borde: #f3d3da;
      --primario: #d6204e;
      --primario-oscuro: #9e1236;
      --acento: #ff6fa3;
      --negro: #1a0b10;
      --peligro: #b3122f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 100% 0%, rgba(255,111,163,.18), transparent 40%),
        radial-gradient(circle at 40% 100%, rgba(214,32,78,.08), transparent 40%),
        var(--fondo);
      background-attachment: fixed;
      color: var(--texto);
    }

    /* ---------- estructura general ---------- */
    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: 250px;
      flex-shrink: 0;
      background: linear-gradient(180deg, var(--negro) 0%, #4a0818 60%, var(--primario-oscuro) 100%);
      color: #fff;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 4px solid var(--acento);
    }
    .marca h1 { margin: 0; font-size: 1.3rem; letter-spacing: .5px; }
    .marca p { margin: 4px 0 28px; font-size: .8rem; opacity: .7; }

    #pestanas { display: flex; flex-direction: column; gap: 6px; }
    #pestanas button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      border: none;
      color: rgba(255,255,255,.75);
      padding: 11px 14px;
      border-radius: 10px;
      font: inherit;
      font-size: .95rem;
      cursor: pointer;
      text-align: left;
      transition: background .15s, color .15s;
    }
    #pestanas button:hover { background: rgba(255,255,255,.08); color: #fff; }
    #pestanas button.activo {
      background: linear-gradient(120deg, var(--primario), var(--acento));
      color: #fff;
      box-shadow: 0 4px 14px rgba(255,111,163,.35);
    }
    .contador {
      background: rgba(255,255,255,.18);
      border-radius: 999px;
      padding: 1px 9px;
      font-size: .78rem;
    }

    .pie-sidebar { margin-top: auto; font-size: .78rem; opacity: .85; }
    .pie-sidebar code { display: block; margin-top: 6px; opacity: .7; }
    #estado-api {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
    }

    .contenido { flex: 1; padding: 28px 32px 40px; min-width: 0; }

    /* ---------- barra superior ---------- */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .migas { margin: 0; color: var(--suave); font-size: .85rem; }
    .topbar h2 { margin: 2px 0 0; font-size: 1.7rem; color: var(--primario-oscuro); }

    /* ---------- tarjetas de resumen ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }
    .stat {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      transition: transform .15s, box-shadow .15s;
    }
    .stat:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(158,18,54,.12); }
    .stat .numero { font-size: 1.9rem; font-weight: 700; color: var(--primario); line-height: 1.1; }
    .stat .nombre { font-size: .85rem; color: var(--suave); }
    .stat.activo {
      background: linear-gradient(135deg, var(--negro), var(--primario-oscuro));
      border-color: transparent;
    }
    .stat.activo .numero { color: var(--acento); }
    .stat.activo .nombre { color: rgba(255,255,255,.8); }

    /* ---------- tabla ---------- */
    .card {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(158,18,54,.08);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .card-head span { color: var(--suave); font-size: .9rem; }
    #buscar {
      padding: 9px 14px;
      border: 1px solid var(--borde);
      border-radius: 999px;
      font: inherit;
      font-size: .9rem;
      width: 240px;
      max-width: 100%;
    }
    #buscar:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px rgba(255,111,163,.25); }
    .tabla-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
    th {
      color: var(--primario-oscuro);
      font-weight: 600;
      text-transform: capitalize;
      background: #fff0f4;
    }
    th:first-child { border-radius: 10px 0 0 10px; }
    th:last-child { border-radius: 0 10px 10px 0; }
    tr:hover td { background: #fff7f9; }
    .vacio { color: var(--suave); text-align: center; padding: 32px; }

    /* ---------- botones ---------- */
    button.principal, button.secundario, button.mini {
      border: none;
      cursor: pointer;
      font: inherit;
      font-size: .9rem;
    }
    button.principal {
      background: linear-gradient(120deg, var(--primario), var(--acento));
      color: #fff;
      padding: 11px 20px;
      border-radius: 999px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(214,32,78,.3);
    }
    button.principal:hover { filter: brightness(.93); }
    button.secundario { background: var(--borde); color: var(--texto); padding: 11px 20px; border-radius: 999px; }
    button.mini { padding: 5px 13px; margin-right: 4px; border-radius: 999px; }
    button.editar { background: #ffe0ea; color: var(--primario-oscuro); }
    button.borrar { background: var(--negro); color: #fff; }
    button.mini:hover { filter: brightness(.9); }

    /* ---------- panel lateral del formulario ---------- */
    #fondo-panel {
      position: fixed;
      inset: 0;
      background: rgba(26,11,16,.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 10;
    }
    #panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px;
      max-width: 100%;
      height: 100vh;
      background: var(--tarjeta);
      border-left: 4px solid var(--primario);
      padding: 26px 24px;
      transform: translateX(100%);
      transition: transform .3s ease;
      z-index: 11;
      overflow-y: auto;
    }
    body.panel-abierto #fondo-panel { opacity: 1; pointer-events: auto; }
    body.panel-abierto #panel { transform: translateX(0); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .panel-head h2 { margin: 0; font-size: 1.2rem; color: var(--primario-oscuro); }
    #cerrar {
      background: #ffe0ea;
      color: var(--primario-oscuro);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
    }
    form label { display: block; font-size: .85rem; color: var(--suave); margin-bottom: 4px; }
    form input, form select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      font: inherit;
      font-size: .95rem;
      margin-bottom: 16px;
    }
    form input:focus, form select:focus {
      outline: none;
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(255,111,163,.25);
    }
    .botones { display: flex; gap: 8px; margin-top: 6px; }
    .botones .principal { flex: 1; }

    /* ---------- aviso ---------- */
    #aviso {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 12px;
      color: #fff;
      display: none;
      max-width: 420px;
      box-shadow: 0 6px 18px rgba(0,0,0,.2);
      z-index: 20;
    }
    #aviso.ok { background: var(--negro); border-left: 5px solid var(--acento); display: block; }
    #aviso.error { background: var(--peligro); display: block; }

    /* ---------- pantallas pequeñas ---------- */
    @media (max-width: 900px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 4px solid var(--acento);
      }
      #pestanas { flex-direction: row; flex-wrap: wrap; }
      .marca p { margin-bottom: 16px; }
      .pie-sidebar { margin-top: 16px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .contenido { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="marca">
        <h1>Panel de tienda</h1>
        <p>Taller Tendencias · Docker Compose</p>
      </div>
      <nav id="pestanas"></nav>
      <div class="pie-sidebar">
        <span id="estado-api">Verificando API…</span>
        <code id="api-url"></code>
      </div>
    </aside>

    <div class="contenido">
      <div class="topbar">
        <div>
          <p class="migas">Administración</p>
          <h2 id="tabla-titulo"></h2>
        </div>
        <button class="principal" id="btn-nuevo">+ Nuevo</button>
      </div>

      <section class="stats" id="stats"></section>

      <section class="card">
        <div class="card-head">
          <span id="resumen"></span>
          <input id="buscar" type="search" placeholder="Buscar en la tabla…">
        </div>
        <div class="tabla-scroll" id="tabla"></div>
      </section>
    </div>
  </div>

  <div id="fondo-panel"></div>
  <aside id="panel" aria-hidden="true">
    <div class="panel-head">
      <h2 id="form-titulo"></h2>
      <button id="cerrar" title="Cerrar">×</button>
    </div>
    <form id="formulario"></form>
  </aside>

  <div id="aviso"></div>

  <script>
    // El fetch corre en el navegador, por eso se usa localhost y el puerto expuesto de la API.
    const API = 'http://localhost:3000';

    const ENTIDADES = {
      categorias: {
        titulo: 'Categorías', singular: 'categoría',
        campos: [
          { nombre: 'nombre', etiqueta: 'Nombre', tipo: 'text', requerido: true },
          { nombre: 'descripcion', etiqueta: 'Descripción', tipo: 'text' }
        ]
      },
      clientes: {
        titulo: 'Clientes', singular: 'cliente',
        campos: [
          { nombre: 'nombre', etiqueta: 'Nombre', tipo: 'text', requerido: true },
          { nombre: 'email', etiqueta: 'Email', tipo: 'email', requerido: true },
          { nombre: 'ciudad', etiqueta: 'Ciudad', tipo: 'text' }
        ]
      },
      productos: {
        titulo: 'Productos', singular: 'producto',
        campos: [
          { nombre: 'nombre', etiqueta: 'Nombre', tipo: 'text', requerido: true },
          { nombre: 'precio', etiqueta: 'Precio', tipo: 'number', paso: '0.01', requerido: true },
          { nombre: 'stock', etiqueta: 'Stock', tipo: 'number', paso: '1' },
          { nombre: 'categoria_id', etiqueta: 'Categoría', tipo: 'select', ref: 'categorias', requerido: true }
        ]
      },
      pedidos: {
        titulo: 'Pedidos', singular: 'pedido',
        campos: [
          { nombre: 'cliente_id', etiqueta: 'Cliente', tipo: 'select', ref: 'clientes', requerido: true },
          { nombre: 'estado', etiqueta: 'Estado', tipo: 'text', sugerencias: true }
        ]
      }
    };

    let actual = 'categorias';
    let editandoId = null;
    let filtro = '';
    const datos = {};

    document.getElementById('api-url').textContent = API;

    // ---------- utilidades ----------
    function esc(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // La API puede devolver una lista directa o un objeto que la contiene.
    function extraerLista(respuesta) {
      if (Array.isArray(respuesta)) return respuesta;
      if (respuesta && typeof respuesta === 'object') {
        for (const valor of Object.values(respuesta)) {
          if (Array.isArray(valor)) return valor;
        }
      }
      return [];
    }

    async function api(ruta, metodo = 'GET', cuerpo = null) {
      const opciones = { method: metodo };
      if (cuerpo) {
        opciones.headers = { 'Content-Type': 'application/json' };
        opciones.body = JSON.stringify(cuerpo);
      }
      const resp = await fetch(API + ruta, opciones);
      let json = null;
      try { json = await resp.json(); } catch (e) { /* respuesta sin cuerpo */ }
      if (!resp.ok) {
        const msg = json && (json.error || json.mensaje || json.message || json.detalle);
        throw new Error(msg || `Error ${resp.status}`);
      }
      return json;
    }

    function avisar(texto, tipo = 'ok') {
      const caja = document.getElementById('aviso');
      caja.textContent = texto;
      caja.className = tipo;
      clearTimeout(avisar.t);
      avisar.t = setTimeout(() => { caja.className = ''; }, 3800);
    }

    async function cargar(entidad) {
      datos[entidad] = extraerLista(await api('/' + entidad));
    }

    function nombrePorId(entidad, id) {
      const item = (datos[entidad] || []).find(x => String(x.id) === String(id));
      return item ? `${item.nombre} (#${id})` : id;
    }

    // ---------- navegación lateral y tarjetas ----------
    function pintarNavegacion() {
      const nav = document.getElementById('pestanas');
      nav.innerHTML = Object.entries(ENTIDADES).map(([clave, cfg]) => `
        <button data-entidad="${clave}" class="${clave === actual ? 'activo' : ''}">
          <span>${cfg.titulo}</span>
          <span class="contador">${(datos[clave] || []).length}</span>
        </button>`
      ).join('');

      const stats = document.getElementById('stats');
      stats.innerHTML = Object.entries(ENTIDADES).map(([clave, cfg]) => `
        <button class="stat ${clave === actual ? 'activo' : ''}" data-entidad="${clave}">
          <div class="numero">${(datos[clave] || []).length}</div>
          <div class="nombre">${cfg.titulo}</div>
        </button>`
      ).join('');

      document.querySelectorAll('[data-entidad]').forEach(b =>
        b.addEventListener('click', () => cambiarEntidad(b.dataset.entidad))
      );
    }

    function cambiarEntidad(entidad) {
      actual = entidad;
      editandoId = null;
      filtro = '';
      document.getElementById('buscar').value = '';
      cerrarPanel();
      pintarTodo();
    }

    async function refrescar() {
      try {
        await Promise.all(Object.keys(ENTIDADES).map(cargar));
      } catch (e) {
        avisar('No se pudo cargar la información: ' + e.message, 'error');
      }
      pintarTodo();
    }

    function pintarTodo() {
      document.getElementById('tabla-titulo').textContent = ENTIDADES[actual].titulo;
      document.getElementById('btn-nuevo').textContent = `+ Nuevo ${ENTIDADES[actual].singular}`;
      pintarNavegacion();
      pintarTabla();
    }

    // ---------- panel del formulario ----------
    function abrirPanel(registro = null) {
      pintarFormulario(registro);
      document.body.classList.add('panel-abierto');
      document.getElementById('panel').setAttribute('aria-hidden', 'false');
      const primero = document.querySelector('#formulario input, #formulario select');
      if (primero) setTimeout(() => primero.focus(), 300);
    }

    function cerrarPanel() {
      document.body.classList.remove('panel-abierto');
      document.getElementById('panel').setAttribute('aria-hidden', 'true');
      editandoId = null;
    }

    document.getElementById('btn-nuevo').addEventListener('click', () => { editandoId = null; abrirPanel(); });
    document.getElementById('cerrar').addEventListener('click', cerrarPanel);
    document.getElementById('fondo-panel').addEventListener('click', cerrarPanel);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarPanel(); });

    function pintarFormulario(registro = null) {
      const cfg = ENTIDADES[actual];
      document.getElementById('form-titulo').textContent =
        editandoId ? `Editar ${cfg.singular} #${editandoId}` : `Nuevo ${cfg.singular}`;

      const form = document.getElementById('formulario');
      form.innerHTML = cfg.campos.map(campo => {
        const valor = registro ? registro[campo.nombre] : '';
        const req = campo.requerido ? 'required' : '';
        const marca = campo.requerido ? ' *' : '';

        if (campo.tipo === 'select') {
          const opciones = (datos[campo.ref] || []).map(item =>
            `<option value="${esc(item.id)}" ${String(item.id) === String(valor) ? 'selected' : ''}>${esc(item.nombre)} (#${esc(item.id)})</option>`
          ).join('');
          return `<label for="${campo.nombre}">${campo.etiqueta}${marca}</label>
                  <select id="${campo.nombre}" name="${campo.nombre}" ${req}>
                    <option value="">Selecciona…</option>${opciones}
                  </select>`;
        }

        let lista = '';
        if (campo.sugerencias) {
          const valores = [...new Set((datos[actual] || []).map(x => x[campo.nombre]).filter(Boolean))];
          lista = `<datalist id="lista-${campo.nombre}">${valores.map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
        }
        return `<label for="${campo.nombre}">${campo.etiqueta}${marca}</label>
                <input id="${campo.nombre}" name="${campo.nombre}" type="${campo.tipo}"
                       ${campo.paso ? `step="${campo.paso}" min="0"` : ''}
                       ${campo.sugerencias ? `list="lista-${campo.nombre}"` : ''}
                       value="${esc(valor)}" ${req}>${lista}`;
      }).join('') + `
        <div class="botones">
          <button type="submit" class="principal">${editandoId ? 'Guardar cambios' : 'Crear'}</button>
          <button type="button" class="secundario" id="cancelar">Cancelar</button>
        </div>`;

      document.getElementById('cancelar').addEventListener('click', cerrarPanel);
    }

    document.getElementById('formulario').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const cfg = ENTIDADES[actual];
      const cuerpo = {};

      for (const campo of cfg.campos) {
        const valor = document.getElementById(campo.nombre).value.trim();
        if (valor === '') continue;
        if (campo.tipo === 'select' || campo.paso === '1') cuerpo[campo.nombre] = parseInt(valor, 10);
        else if (campo.tipo === 'number') cuerpo[campo.nombre] = parseFloat(valor);
        else cuerpo[campo.nombre] = valor;
      }

      try {
        if (editandoId) {
          await api(`/${actual}/${editandoId}`, 'PUT', cuerpo);
          avisar(`${cfg.singular} #${editandoId} actualizado`);
        } else {
          await api(`/${actual}`, 'POST', cuerpo);
          avisar(`${cfg.singular} creado correctamente`);
        }
        cerrarPanel();
        await refrescar();
      } catch (e) {
        avisar('Error: ' + e.message, 'error');
      }
    });

    // ---------- tabla ----------
    document.getElementById('buscar').addEventListener('input', e => {
      filtro = e.target.value.trim().toLowerCase();
      pintarTabla();
    });

    function pintarTabla() {
      const cfg = ENTIDADES[actual];
      const todas = datos[actual] || [];
      const refs = Object.fromEntries(cfg.campos.filter(c => c.ref).map(c => [c.nombre, c.ref]));
      const textoCelda = (fila, col) => refs[col] ? nombrePorId(refs[col], fila[col]) : fila[col];

      const filas = filtro
        ? todas.filter(f => Object.keys(f).some(col => String(textoCelda(f, col) ?? '').toLowerCase().includes(filtro)))
        : todas;

      document.getElementById('resumen').textContent = filtro
        ? `${filas.length} de ${todas.length} registros`
        : `${todas.length} registros`;

      const contenedor = document.getElementById('tabla');
      if (filas.length === 0) {
        contenedor.innerHTML = `<p class="vacio">${filtro ? 'Ningún registro coincide con la búsqueda.' : 'No hay registros todavía.'}</p>`;
        return;
      }

      const columnas = Object.keys(todas[0]);
      const encabezado = columnas.map(c => `<th>${esc(c.replace(/_/g, ' '))}</th>`).join('') + '<th>Acciones</th>';
      const cuerpo = filas.map(fila => {
        const celdas = columnas.map(col => `<td>${esc(textoCelda(fila, col))}</td>`).join('');
        return `<tr>${celdas}
          <td>
            <button class="mini editar" data-id="${esc(fila.id)}">Editar</button>
            <button class="mini borrar" data-id="${esc(fila.id)}">Eliminar</button>
          </td></tr>`;
      }).join('');

      contenedor.innerHTML = `<table><thead><tr>${encabezado}</tr></thead><tbody>${cuerpo}</tbody></table>`;

      contenedor.querySelectorAll('.editar').forEach(b => b.addEventListener('click', () => {
        editandoId = b.dataset.id;
        abrirPanel(todas.find(f => String(f.id) === editandoId));
      }));

      contenedor.querySelectorAll('.borrar').forEach(b => b.addEventListener('click', async () => {
        if (!confirm(`¿Eliminar ${cfg.singular} #${b.dataset.id}?`)) return;
        try {
          await api(`/${actual}/${b.dataset.id}`, 'DELETE');
          avisar(`${cfg.singular} #${b.dataset.id} eliminado`);
          await refrescar();
        } catch (e) {
          // Si otros registros apuntan a este (clave foránea), se muestra un mensaje claro.
          const esLlave = /foreign|llave|clave|referen|constraint|viola|depend|asociad/i.test(e.message);
          avisar(esLlave
            ? `No se puede eliminar ${cfg.singular} #${b.dataset.id}: tiene registros asociados en otra tabla. Elimina o cambia primero esos registros.`
            : 'No se pudo eliminar: ' + e.message, 'error');
        }
      }));
    }

    // ---------- estado de la API ----------
    async function verificarApi() {
      const etiqueta = document.getElementById('estado-api');
      try {
        await api('/health');
        etiqueta.textContent = '● API conectada';
        etiqueta.style.background = 'rgba(255,111,163,.35)';
      } catch (e) {
        etiqueta.textContent = '● API sin conexión';
        etiqueta.style.background = 'rgba(179,18,47,.9)';
      }
    }

    verificarApi();
    refrescar();
  </script>
